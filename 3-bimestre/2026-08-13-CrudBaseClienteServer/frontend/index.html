<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão - Home</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/menu.css">
</head>
<body>
    <header>
        <h1>Painel de Controle</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/pages/produtos.html">Gestão de Produtos</a>
        </nav>
    </header>

    <main>
        <h2>Selecione um Módulo</h2>
        <div class="menu-grid">
            <div class="menu-card" onclick="window.location.href='/pages/produtos.html'">
                <h3>📦 Produtos</h3>
                <p>Cadastre, altere e controle o estoque de produtos.</p>
            </div>
        </div>

        <div class="card bilhete-section">
            <h3>✉️ Enviar Bilhete (Teste de Regras)</h3>
            <p>Envie palavras-chave como <strong>"vovó"</strong>, <strong>"chegou"</strong> ou <strong>"situacao"</strong>.</p>
            <div class="bilhete-input-group">
                <input type="text" id="input-mensagem" placeholder="Digite sua mensagem...">
                <button class="btn btn-primary" id="btn-enviar-mensagem">Enviar</button>
            </div>
            <div id="resposta-bilhete"></div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/menu.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Produtos</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/crud.css">
</head>
<body>
    <header>
        <h1>CRUD de Produtos</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/pages/produtos.html">Gestão de Produtos</a>
        </nav>
    </header>

    <main>
        <!-- Formulário de Cadastro/Edição -->
        <div class="card">
            <h2 id="form-titulo">Cadastrar Produto</h2>
            <form id="form-produto">
                <input type="hidden" id="id_produto">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome_produto">Nome do Produto</label>
                        <input type="text" id="nome_produto" required placeholder="Ex: Cesta de Doces">
                    </div>
                    <div class="form-group">
                        <label for="quantidade_produto">Quantidade Atual</label>
                        <input type="number" id="quantidade_produto" required min="0">
                    </div>
                    <div class="form-group">
                        <label for="quantidade_minima_produto">Qtd. Mínima</label>
                        <input type="number" id="quantidade_minima_produto" required min="0">
                    </div>
                    <div class="form-group">
                        <label for="quantidade_maxima_produto">Qtd. Máxima</label>
                        <input type="number" id="quantidade_maxima_produto" required min="0">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-success" id="btn-salvar">Salvar</button>
                    <button type="button" class="btn btn-danger" id="btn-cancelar" style="display:none;">Cancelar Edição</button>
                    <button type="button" class="btn btn-warning" id="btn-situacao">Verificar Situação do Estoque</button>
                </div>
            </form>
        </div>

        <!-- Tabela de Listagem -->
        <div class="card">
            <h2>Lista de Produtos</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Qtd. Atual</th>
                            <th>Qtd. Mínima</th>
                            <th>Qtd. Máxima</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos-body">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/crudProdutos.js"></script>
</body>
</html>

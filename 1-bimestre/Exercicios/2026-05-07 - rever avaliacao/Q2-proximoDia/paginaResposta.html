<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resposta</title>
</head>

<body>
    <h1>O próximo dia é:</h1>
    <p id="resposta"></p>
    <script>

        // Pega os dados da URL
        const parametros = new URLSearchParams(window.location.search);

        let dia = parseInt(parametros.get("dia"));
        let mes = parseInt(parametros.get("mes"));
        let ano = parseInt(parametros.get("ano"));

        // Soma 1 dia
        dia++;
       
        if (mes == 2) {
            // Ano bissexto
            if ((ano % 4 == 0 && ano % 100 != 0) || (ano % 400 == 0)) {
                if (dia > 29) {
                    dia = 1;
                    mes++;
                }

            } else {
                if (dia > 28) {
                    dia = 1;
                    mes++;
                }
            }
        } else if (mes == 1 || mes == 3 || mes == 5 || mes == 7 || mes == 8 || mes == 10 || mes == 12) {
            if (dia > 31) {
                dia = 1;
                mes++;
            }
        } else {
            if (dia > 30) {
                dia = 1;
                mes++;
            }
        }

        // Virada de ano
        if (mes > 12) {
            mes = 1;
            ano++;
        }

        // Mostra o resultado
        document.getElementById("resposta").innerHTML =
            dia + "/" + mes + "/" + ano;

    </script>
</body>

</html>

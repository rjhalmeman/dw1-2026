<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Burgão</title>
    <link rel="stylesheet" href="burgao.css">
</head>
<body>

    <div class="container">
        
        <h1>Cardápio Burgão</h1>

        <p class="aviso">Atenção: Confira os itens antes de fechar o pedido!</p>

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Especificação</th>
                    <th>Preço (R$)</th>
                    <th>Quantidade</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>100</td>
                    <td>Cachorro quente</td>
                    <td>18,10</td>
                    <td><input type="number" id="qtd100" value="0" min="0"></td>
                </tr>
                <tr>
                    <td>101</td>
                    <td>Bauru simples</td>
                    <td>11,30</td>
                    <td><input type="number" id="qtd101" value="0" min="0"></td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Bauru c/ovo</td>
                    <td>11,50</td>
                    <td><input type="number" id="qtd102" value="0" min="0"></td>
                </tr>
                <tr>
                    <td>103</td>
                    <td>Hamburger</td>
                    <td>19,10</td>
                    <td><input type="number" id="qtd103" value="0" min="0"></td>
                </tr>
                <tr>
                    <td>104</td>
                    <td>Cheeseburger</td>
                    <td>21,30</td>
                    <td><input type="number" id="qtd104" value="0" min="0"></td>
                </tr>
                <tr>
                    <td>105</td>
                    <td>Refrigerante</td>
                    <td>6,00</td>
                    <td><input type="number" id="qtd105" value="0" min="0"></td>
                </tr>
            </tbody>
        </table>

        <button onclick="calcularTotal()">Calcular Total</button>

        <h2 id="resultado">Total a pagar: R$ 0,00</h2>

    </div>

    <script src="burgao.js"></script>

</body>
</html>
